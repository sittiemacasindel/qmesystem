android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Suppresses the "AGP only tested up to compileSdk=34" warning
android.suppressUnsupportedCompileSdk=35

# Gradle daemon heap — increased to prevent OOM crashes
org.gradle.jvmargs=-Xmx3072m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# Kotlin compile daemon heap — increased to match
kotlin.daemon.jvm.options=-Xmx3072m -Xms512m

# Keep daemon alive and enable parallel builds
org.gradle.daemon=true
org.gradle.parallel=true
