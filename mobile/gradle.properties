android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Suppresses the "AGP only tested up to compileSdk=34" warning
android.suppressUnsupportedCompileSdk=35

# Gradle daemon heap (fixes "JVM garbage collector is thrashing" crash)
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compile daemon heap
kotlin.daemon.jvm.options=-Xmx2048m -Xms512m
